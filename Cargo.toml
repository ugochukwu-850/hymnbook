[package]
name = "Audible"
version = "0.1.0"
edition = "2024"



[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["font-kit"] }
gpui-kit = { version = "0.9.1", features = ["gpui-fast"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
cpal = "0.18.2"
rustysynth = "1.3.8"
midly = "0.5.3"
