[package]
name = "hymnbook"
version = "0.1.1"
edition = "2024"
description = "Faith Tabernacle Hymn Book: browse every hymn and hear its tune"
license = "MIT"
readme = "README.md"
rust-version = "1.85"

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["font-kit"] }
gpui-kit = { version = "0.9.1", features = ["gpui-fast"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
cpal = "0.18.2"
rustysynth = "1.3.8"
midly = "0.5.3"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Small, fast release binaries.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
