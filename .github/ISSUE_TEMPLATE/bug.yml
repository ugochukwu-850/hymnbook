name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: input
    id: os
    attributes: {label: Operating system, placeholder: "Windows 11 / macOS 15 / Ubuntu 24.04"}
    validations: {required: true}
  - type: textarea
    id: what
    attributes: {label: What happened, and what did you expect?}
    validations: {required: true}
  - type: textarea
    id: steps
    attributes: {label: Steps to reproduce}
